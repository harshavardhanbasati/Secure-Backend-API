services:

  api:
    build: .
    container_name: secure_db_api
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./uploads:/app/uploads


  db:
    image: postgres:18
    container_name: secure_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: secure_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_db"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: